name: WinImageStudio Windows download
on:
  push:
    paths:
      - 'WinImageStudio/**'
      - '.github/workflows/winimage-studio.yml'
  pull_request:
    paths:
      - 'WinImageStudio/**'
      - '.github/workflows/winimage-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WinImageStudio
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify tests
        run: |
          dotnet run --project tests/WinImageStudio.Tests/WinImageStudio.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          foreach ($file in @('build.ps1','src/WinImageStudio.Desktop/Scripts/ImageTools.ps1','src/WinImageStudio.Desktop/Scripts/MediaCopy.ps1','tests/MediaCopy.Tests.ps1','tests/PresetMetadata.Tests.ps1','src/WinImageStudio.Desktop/Scripts/PresetMetadata.ps1','src/WinImageStudio.Desktop/Scripts/VerifyAdk.ps1','installer/build-installer.ps1','tests/Installer.Smoke.ps1','tests/Installer.Finish.ps1','tests/Lite.Smoke.ps1','tests/LiteInstaller.Smoke.ps1')) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
      - name: Regression tests for ISO file copying
        shell: powershell
        run: |
          & ./tests/MediaCopy.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression tests for preset package metadata
        shell: powershell
        run: |
          & ./tests/PresetMetadata.Tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify integrated Microsoft ADK setup
        run: |
          dotnet run --project tests/WinImageStudio.Tests/WinImageStudio.Tests.csproj -c Release -- --adk-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable
        run: |
          dotnet publish src/WinImageStudio.Desktop/WinImageStudio.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($required in @('WinImageStudio.exe','Scripts/ImageTools.ps1','Scripts/MediaCopy.ps1','Scripts/PresetMetadata.ps1','Scripts/VerifyAdk.ps1','Prerequisites/adksetup.exe','Start-WinImageStudio.cmd')) {
            if (!(Test-Path -LiteralPath (Join-Path 'artifacts/win-x64' $required))) { throw "Published package is missing $required" }
          }
          Copy-Item README.ar.md,LICENSE -Destination artifacts/win-x64
          Copy-Item third-party -Destination artifacts/win-x64 -Recurse
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/WinImageStudio-windows-x64.zip
          Get-FileHash artifacts/WinImageStudio-windows-x64.zip -Algorithm SHA256 | Format-List
      - name: Build minimal Lite application
        run: |
          dotnet publish src/WinImageStudio.Lite/WinImageStudio.Lite.csproj -c Release -r win-x64 --self-contained true -o artifacts/lite-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE -Destination artifacts/lite-win-x64
          Copy-Item installer/LITE.ar.txt -Destination artifacts/lite-win-x64
          Copy-Item third-party -Destination artifacts/lite-win-x64 -Recurse
      - name: Verify desktop startup and path navigation
        shell: powershell
        run: |
          & ./tests/Desktop.Smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Lite automatic output on a saved native fixture
        shell: powershell
        run: |
          & ./tests/Lite.Smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build single-file Windows installer
        shell: powershell
        run: |
          & ./installer/build-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installation upgrade and uninstall preservation
        shell: powershell
        run: |
          & ./tests/Installer.Smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Lite installation and project preservation
        shell: powershell
        run: |
          & ./tests/LiteInstaller.Smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify interactive Finish launches full app with elevation
        shell: powershell
        run: |
          & ./tests/Installer.Finish.ps1 -SetupPath artifacts/setup/WinImageStudio-Setup-0.6.1-x64.exe -AppName WinImageStudio
      - name: Verify interactive Finish launches Lite with elevation
        shell: powershell
        run: |
          & ./tests/Installer.Finish.ps1 -SetupPath artifacts/setup/WinImageStudio-Lite-Setup-0.7.0-x64.exe -AppName WinImageStudio.Lite
      - name: Downloadable EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: WinImageStudio-Setup-windows-x64
          path: WinImageStudio/artifacts/setup/
          if-no-files-found: error
          retention-days: 30
      - name: Downloadable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WinImageStudio-windows-x64
          path: WinImageStudio/artifacts/win-x64/
          if-no-files-found: error
          retention-days: 30

  publish-installer:
    needs: windows-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinImageStudio-Setup-windows-x64
          path: release-files
      - name: Publish tested installer for direct EXE download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="winimagestudio-lite-v0.7.0-${GITHUB_SHA:0:7}"
          cat > release-notes.txt <<'NOTES'
          WinImageStudio Lite 0.7.0 automatic strong customization for Windows 10/11 client editions, plus WinImageStudio full 0.6.1 with corrected post-install elevation. Includes the exact user-supplied Microsoft ADK bootstrapper, checked by SHA-256 and Microsoft Authenticode before execution. The optional Deployment Tools step may require internet. Installer, installed app, upgrade and uninstall preservation tests passed on Windows. User projects/ISOs and shared Microsoft ADK remain after uninstall. See INSTALL.ar.txt for Arabic instructions.
          NOTES
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" release-files/* --target "$GITHUB_SHA" --title "WinImageStudio Lite 0.7.0 + Full 0.6.1" --notes-file release-notes.txt
          fi
